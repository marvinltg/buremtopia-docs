<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>buremTOPIA Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Log in with your buremTOPIA ID</h1>
    <form method="POST" action="/player/growid/login/validate" autocomplete="off">
      <input type="hidden" name="_token" value="{{TOKEN}}" />
      <div class="input-wrapper">
        <input id="login-name" name="growId" type="text" placeholder="Your Name" maxlength="18" required />
      </div>
      <div class="input-wrapper">
        <input id="password" name="password" type="password" placeholder="Your Password" maxlength="18" />
      </div>
      <p class="hint">Create account? Enter Name without Password &amp; Log In!</p>
      <a class="discord-link" href="https://discord.gg/yMBDMA5grc" target="_blank">Need Help? Join our Discord!</a>
      <button id="submit-btn" type="submit" name="action" value="login">Register/Login</button>
    </form>
    <div class="err"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
